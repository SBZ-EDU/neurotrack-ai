<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroTrack AI - نسخه 2 (React-Style)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e); z-index: -2; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 50%, rgba(102,126,234,0.15), transparent 50%), radial-gradient(circle at 80% 20%, rgba(118,75,162,0.15), transparent 50%), radial-gradient(circle at 50% 80%, rgba(240,147,251,0.1), transparent 50%); }
        .header { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 15px 0; position: fixed; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .container { max-width: 1200px; margin: auto; padding: 0 20px; }
        .hdr { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 25px; }
        .nav a { color: #fff; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav a:hover { color: #667eea; }
        .lang { display: flex; gap: 8px; }
        .lang-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .lang-btn.active { background: #667eea; }
        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; }
        .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .hero h1 { font-size: 48px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; }
        .hero h1 span { background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 18px; color: #aaa; margin-bottom: 30px; line-height: 1.8; }
        .btns { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-p { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; }
        .btn-p:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn-o { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.3); }
        .btn-o:hover { border-color: #667eea; background: rgba(102,126,234,0.1); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
        .stat { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; transition: 0.3s; }
        .stat:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }
        .stat-n { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-l { font-size: 12px; color: #888; margin-top: 5px; }
        .visual { width: 100%; height: 400px; background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); border-radius: 30px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .visual::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, rgba(102,126,234,0.3), transparent); animation: rotate 10s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .visual-icon { font-size: 120px; z-index: 1; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .section { padding: 100px 0; }
        .section-t { text-align: center; margin-bottom: 60px; }
        .section-t h2 { font-size: 36px; font-weight: 800; margin-bottom: 15px; }
        .section-t h2 span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-t p { color: #888; font-size: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); border-color: #667eea; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card h3 { font-size: 18px; margin-bottom: 10px; }
        .card p { font-size: 14px; color: #888; line-height: 1.6; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .paper-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .paper-card:hover { transform: translateY(-3px); border-color: #667eea; }
        .paper-card h3 { font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .cnt { background: linear-gradient(135deg, #667eea, #764ba2); padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .areas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .tag { background: rgba(102,126,234,0.2); color: #667eea; padding: 6px 12px; border-radius: 8px; font-size: 12px; transition: 0.3s; cursor: pointer; }
        .tag:hover { background: rgba(102,126,234,0.4); }
        .chart-container { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 30px; }
        .commit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .commit-card { background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1)); padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; transition: 0.3s; }
        .commit-card:hover { transform: translateY(-5px); border-color: #667eea; }
        .commit-icon { font-size: 50px; margin-bottom: 20px; }
        .commit-card h3 { font-size: 20px; margin-bottom: 10px; }
        .commit-card p { font-size: 14px; color: #888; line-height: 1.6; }
        .badge { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 12px; margin-top: 15px; }
        .api-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .api-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); font-family: monospace; transition: 0.3s; cursor: pointer; }
        .api-card:hover { transform: translateY(-3px); border-color: #4CAF50; }
        .method { color: #4CAF50; font-weight: bold; }
        .endpoint { color: #667eea; }
        .desc { color: #888; font-size: 12px; margin-top: 8px; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .contact-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; transition: 0.3s; }
        .contact-item:hover { background: rgba(255,255,255,0.1); }
        .contact-icon { font-size: 30px; }
        .contact-item h4 { font-size: 16px; margin-bottom: 5px; }
        .contact-item p { font-size: 14px; color: #888; }
        .socials { display: flex; gap: 15px; margin-top: 30px; }
        .social { width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; text-decoration: none; }
        .social:hover { background: #667eea; transform: translateY(-3px); }
        .footer { background: rgba(255,255,255,0.05); padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .footer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        .footer h4 { font-size: 16px; margin-bottom: 15px; }
        .footer p, .footer a { font-size: 13px; color: #888; line-height: 1.8; text-decoration: none; }
        .footer a:hover { color: #667eea; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .tab.active { background: #667eea; }
        .tab:hover { background: rgba(102,126,234,0.3); }
        @media (max-width: 768px) { .hero-grid, .grid-2, .contact-grid, .commit-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 32px; } .stats { grid-template-columns: repeat(2, 1fr); } .footer-grid { grid-template-columns: 1fr 1fr; } .nav { display: none; } }
    </style>
</head>
<body>
<div class="bg"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Data
const FEATURES = [
    { icon: "🧠", title: "تشخیص AI", desc: "تشخیص هوشمند با الگوریتم‌های یادگیری عمیق" },
    { icon: "📊", title: "تحلیل داده", desc: "تحلیل جامع داده‌های بالینی و پژوهشی" },
    { icon: "💊", title: "توصیه درمان", desc: "پروتکل‌های درمانی مبتنی بر شواهد FDA" },
    { icon: "📚", title: "پایگاه داده", desc: "200 مقاله علمی در 20 حوزه تخصصی" },
    { icon: "🤖", title: "ربات تلگرام", desc: "دسترسی آسان 24 ساعته" },
    { icon: "🌐", title: "چند زبانه", desc: "فارسی، انگلیسی، عربی، ترکی" }
];

const AUTISM_AREAS = ["اتصالات مغزی", "ژنتیک", "درمان", "تشخیص", "خانواده", "آموزش", "حسی", "ارتباط", "بزرگسالان", "فناوری"];
const SCHIZO_AREAS = ["اتصالات مغزی", "ژنتیک", "درمان", "تشخیص", "خانواده", "عصب‌زیستی", "شناخت", "بهبود", "همراهی", "فناوری"];

const COMMITS = [
    { icon: "🔬", title: "تعهد علمی", desc: "مقالات Peer-Reviewed و ژورنال‌های معتبر بین‌المللی", badge: "✅ Peer-Reviewed" },
    { icon: "💚", title: "تعهد اخلاقی", desc: "حفظ حریم خصوصی، استانداردهای FDA و کرامت انسانی", badge: "✅ HIPAA Compliant" },
    { icon: "🤝", title: "تعهد اجتماعی", desc: "دسترسی رایگان به منابع آموزشی و حمایت خانواده‌ها", badge: "✅ Free Access" }
];

const APIS = [
    { method: "GET", endpoint: "/api/papers", desc: "تمام 200 مقاله" },
    { method: "GET", endpoint: "/api/autism", desc: "مقالات اوتیسم" },
    { method: "GET", endpoint: "/api/schizophrenia", desc: "مقالات اسکیزوفرنی" },
    { method: "GET", endpoint: "/api/users", desc: "اطلاعات کاربران" },
    { method: "GET", endpoint: "/api/categories", desc: "دسته‌بندی‌ها" },
    { method: "POST", endpoint: "/api/email/send", desc: "ارسال ایمیل" }
];

// Components
function Header() {
    const [activeLang, setActiveLang] = useState('fa');
    return (
        <header className="header">
            <div className="container">
                <div className="hdr">
                    <div className="logo">🧠 NeuroTrack AI</div>
                    <nav className="nav">
                        <a href="#features">ویژگی‌ها</a>
                        <a href="#papers">مقالات</a>
                        <a href="#commitment">تعهدات</a>
                        <a href="#api">API</a>
                        <a href="#contact">تماس</a>
                    </nav>
                    <div className="lang">
                        {['fa', 'en', 'ar', 'tr'].map(lang => (
                            <button key={lang} className={`lang-btn ${activeLang === lang ? 'active' : ''}`} onClick={() => setActiveLang(lang)}>
                                {lang === 'fa' ? '🇮🇷' : lang === 'en' ? '🇬🇧' : lang === 'ar' ? '🇸🇦' : '🇹🇷'}
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        </header>
    );
}

function Hero() {
    return (
        <section className="hero">
            <div className="container">
                <div className="hero-grid">
                    <div>
                        <h1>آینده <span>سلامت روان</span> با هوش مصنوعی</h1>
                        <p>پلتفرم پیشرفته تشخیص و درمان اختلالات طیف اوتیسم و اسکیزوفرنی با 200 مقاله علمی معتبر</p>
                        <div className="btns">
                            <a href="https://t.me/Ai_autism_schizo_bot" className="btn btn-p">🤖 شروع ربات</a>
                            <a href="#papers" className="btn btn-o">📄 مقالات</a>
                        </div>
                        <div className="stats">
                            <div className="stat"><div className="stat-n">200</div><div className="stat-l">مقاله علمی</div></div>
                            <div className="stat"><div className="stat-n">20</div><div className="stat-l">حوزه تخصصی</div></div>
                            <div className="stat"><div className="stat-n">100</div><div className="stat-l">مقاله/روز</div></div>
                            <div className="stat"><div className="stat-n">24/7</div><div className="stat-l">پشتیبانی</div></div>
                        </div>
                    </div>
                    <div className="visual">
                        <div className="visual-icon">🧠</div>
                    </div>
                </div>
            </div>
        </section>
    );
}

function Features() {
    return (
        <section className="section" id="features">
            <div className="container">
                <div className="section-t">
                    <h2>ویژگی‌های <span>پلتفرم</span></h2>
                    <p>ابزارهای پیشرفته برای تشخیص و درمان</p>
                </div>
                <div className="grid-3">
                    {FEATURES.map((f, i) => (
                        <div key={i} className="card">
                            <div className="card-icon">{f.icon}</div>
                            <h3>{f.title}</h3>
                            <p>{f.desc}</p>
                        </div>
                    ))}
                </div>
            </div>
        </section>
    );
}

function Papers() {
    const [activeTab, setActiveTab] = useState('autism');
    const chartRef = useRef(null);
    
    useEffect(() => {
        if (chartRef.current) {
            const ctx = chartRef.current.getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: activeTab === 'autism' ? AUTISM_AREAS : SCHIZO_AREAS,
                    datasets: [{
                        data: Array(10).fill(10),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4CAF50', '#ff9800', '#e91e63', '#00bcd4', '#ff5722', '#9c27b0', '#607d8b']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
            });
        }
    }, [activeTab]);
    
    return (
        <section className="section" id="papers" style={{background:'rgba(255,255,255,.02)'}}>
            <div className="container">
                <div className="section-t">
                    <h2>مقالات <span>علمی</span></h2>
                    <p>200 مقاله در 20 حوزه تخصصی</p>
                </div>
                <div className="tabs">
                    <button className={`tab ${activeTab === 'autism' ? 'active' : ''}`} onClick={() => setActiveTab('autism')}>🧩 اوتیسم (100)</button>
                    <button className={`tab ${activeTab === 'schizo' ? 'active' : ''}`} onClick={() => setActiveTab('schizo')}>🧠 اسکیزوفرنی (100)</button>
                </div>
                <div className="grid-2">
                    <div className="paper-card">
                        <h3>{activeTab === 'autism' ? '🧩 اوتیسم' : '🧠 اسکیزوفرنی'} <span className="cnt">100</span></h3>
                        <p>مقالات علمی معتبر در {activeTab === 'autism' ? '10 حوزه' : '10 حوزه'}</p>
                        <div className="areas">
                            {(activeTab === 'autism' ? AUTISM_AREAS : SCHIZO_AREAS).map((a, i) => (
                                <span key={i} className="tag">{['🧠','🧬','💊','🔍','👨‍👩‍👧','📖','👂','🗣️','👨','💻'][i]} {a}</span>
                            ))}
                        </div>
                    </div>
                    <div className="chart-container">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            </div>
        </section>
    );
}

function Commitments() {
    return (
        <section className="section" id="commitment">
            <div className="container">
                <div className="section-t">
                    <h2>تعهدات <span>ما</span></h2>
                    <p>سه تعهد اصلی NeuroTrack AI</p>
                </div>
                <div className="commit-grid">
                    {COMMITS.map((c, i) => (
                        <div key={i} className="commit-card">
                            <div className="commit-icon">{c.icon}</div>
                            <h3>{c.title}</h3>
                            <p>{c.desc}</p>
                            <div className="badge">{c.badge}</div>
                        </div>
                    ))}
                </div>
            </div>
        </section>
    );
}

function API() {
    return (
        <section className="section" id="api" style={{background:'rgba(255,255,255,.02)'}}>
            <div className="container">
                <div className="section-t">
                    <h2>دسترسی <span>API</span></h2>
                    <p>رابط برنامه‌نویسی برای توسعه‌دهندگان</p>
                </div>
                <div className="api-grid">
                    {APIS.map((a, i) => (
                        <div key={i} className="api-card">
                            <div><span className="method">{a.method}</span> <span className="endpoint">{a.endpoint}</span></div>
                            <div className="desc">{a.desc}</div>
                        </div>
                    ))}
                </div>
            </div>
        </section>
    );
}

function Contact() {
    return (
        <section className="section" id="contact">
            <div className="container">
                <div className="section-t">
                    <h2>تماس <span>با ما</span></h2>
                    <p>ما آماده پاسخگویی به شما هستیم</p>
                </div>
                <div className="contact-grid">
                    <div>
                        <div className="contact-item"><div className="contact-icon">📱</div><div><h4>تلفن</h4><p>+1-208-5033653</p></div></div>
                        <div className="contact-item"><div className="contact-icon">💬</div><div><h4>واتساپ</h4><p>+1-208-5033653</p></div></div>
                        <div className="contact-item"><div className="contact-icon">📧</div><div><h4>ایمیل</h4><p>neurotrack@ai.com</p></div></div>
                        <div className="socials">
                            <a href="https://t.me/Ai_autism_schizo_bot" className="social">🤖</a>
                            <a href="https://t.me/Ai_autism_schizo" className="social">🇬🇧</a>
                            <a href="https://t.me/Ai_autism_schizo_fa" className="social">🇮🇷</a>
                            <a href="https://t.me/Ai_autism_schizo_group" className="social">👥</a>
                        </div>
                    </div>
                    <div>
                        <iframe src="https://neurotrack-bot.elasa2next.workers.dev/papers" style={{width:'100%',height:'400px',border:'none',borderRadius:'20px',background:'rgba(255,255,255,.05)'}}></iframe>
                    </div>
                </div>
            </div>
        </section>
    );
}

function Footer() {
    return (
        <footer className="footer">
            <div className="container">
                <div className="footer-grid">
                    <div><h4>🧠 NeuroTrack AI</h4><p>پلتفرم هوش مصنوعی سلامت روان</p></div>
                    <div><h4>لینک‌ها</h4><p><a href="#features">ویژگی‌ها</a></p><p><a href="#papers">مقالات</a></p><p><a href="#commitment">تعهدات</a></p></div>
                    <div><h4>ربات‌ها</h4><p><a href="https://t.me/Ai_autism_schizo_bot">🤖 ربات</a></p><p><a href="https://t.me/Ai_autism_schizo">🇬🇧 EN</a></p><p><a href="https://t.me/Ai_autism_schizo_fa">🇮🇷 FA</a></p></div>
                    <div><h4>تماس</h4><p>📱 +1-208-5033653</p><p>📧 neurotrack@ai.com</p></div>
                </div>
                <div style={{textAlign:'center',marginTop:'30px',paddingTop:'20px',borderTop:'1px solid rgba(255,255,255,.1)'}}>
                    <p>© 2025 NeuroTrack AI - Version 2 (React-Style with Charts)</p>
                </div>
            </div>
        </footer>
    );
}

// App
function App() {
    return (
        <>
            <Header />
            <Hero />
            <Features />
            <Papers />
            <Commitments />
            <API />
            <Contact />
            <Footer />
        </>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
