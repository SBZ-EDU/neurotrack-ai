<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroTrack AI - انتخاب نسخه</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0a0a, #1a1a2e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 36px; margin-bottom: 10px; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #888; margin-bottom: 40px; font-size: 18px; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 800px; margin: auto; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); transition: 0.3s; cursor: pointer; text-decoration: none; color: #fff; }
        .card:hover { transform: translateY(-10px); border-color: #667eea; box-shadow: 0 20px 40px rgba(102,126,234,0.3); }
        .card-icon { font-size: 60px; margin-bottom: 20px; }
        .card h2 { font-size: 24px; margin-bottom: 10px; }
        .card p { font-size: 14px; color: #888; margin-bottom: 20px; }
        .card .features { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .card .features span { background: rgba(102,126,234,0.2); color: #667eea; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
        .card .btn { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 12px 24px; border-radius: 10px; margin-top: 20px; font-weight: 600; }
        .badge { display: inline-block; background: #4CAF50; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 11px; margin-bottom: 15px; }
        @media (max-width: 768px) { .cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 NeuroTrack AI</h1>
        <p>نسخه مورد نظر خود را انتخاب کنید</p>
        <div class="cards">
            <a href="v1/index.html" class="card">
                <div class="card-icon">📄</div>
                <span class="badge">نسخه 1</span>
                <h2>HTML/CSS/JS</h2>
                <p>نسخه ساده و سبک با عملکرد بالا</p>
                <div class="features">
                    <span>✅ Vanilla JS</span>
                    <span>✅ سبک</span>
                    <span>✅ سریع</span>
                    <span>✅ SEO Friendly</span>
                </div>
                <div class="btn">مشاهده نسخه 1</div>
            </a>
            <a href="v2/index.html" class="card">
                <div class="card-icon">⚛️</div>
                <span class="badge">نسخه 2</span>
                <h2>React-Style + Charts</h2>
                <p>نسخه مدرن با نمودار و کامپوننت‌ها</p>
                <div class="features">
                    <span>✅ React</span>
                    <span>✅ Charts</span>
                    <span>✅ Interactive</span>
                    <span>✅ Modern UI</span>
                </div>
                <div class="btn">مشاهده نسخه 2</div>
            </a>
        </div>
    </div>
</body>
</html>
