<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroTrack AI - نسخه WordPress-Style</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }
        
        /* WordPress-style Header */
        .wp-header { background: #1e1e1e; border-bottom: 3px solid #667eea; position: fixed; width: 100%; z-index: 1000; }
        .wp-top-bar { background: #0073aa; padding: 8px 0; font-size: 12px; }
        .wp-top-bar .container { display: flex; justify-content: space-between; align-items: center; }
        .wp-top-bar a { color: #fff; text-decoration: none; margin-left: 15px; }
        .wp-main-bar { background: #1e1e1e; padding: 12px 0; }
        .wp-main-bar .container { display: flex; justify-content: space-between; align-items: center; }
        .wp-logo { display: flex; align-items: center; gap: 12px; }
        .wp-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .wp-logo-text { font-size: 18px; font-weight: 700; color: #fff; }
        .wp-logo-sub { font-size: 11px; color: #999; }
        
        /* WordPress Navigation */
        .wp-nav { display: flex; gap: 0; }
        .wp-nav-item { padding: 12px 18px; color: #ccc; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid transparent; position: relative; }
        .wp-nav-item:hover, .wp-nav-item.active { color: #fff; background: rgba(255,255,255,0.05); border-bottom-color: #667eea; }
        .wp-nav-item i { font-size: 16px; width: 20px; text-align: center; }
        .wp-nav-badge { background: #667eea; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: 5px; }
        
        /* Dropdown Menu */
        .wp-dropdown { position: relative; }
        .wp-dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: #2d2d2d; min-width: 220px; border-radius: 0 0 8px 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        .wp-dropdown:hover .wp-dropdown-content { display: block; }
        .wp-dropdown-item { padding: 12px 16px; color: #ccc; text-decoration: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .wp-dropdown-item:hover { background: #667eea; color: #fff; }
        .wp-dropdown-item i { width: 18px; text-align: center; font-size: 14px; }
        
        /* WordPress Admin Bar */
        .wp-admin-bar { background: #23282d; padding: 10px 0; display: flex; gap: 15px; overflow-x: auto; }
        .wp-admin-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 8px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .wp-admin-btn:hover { background: #667eea; color: #fff; border-color: #667eea; }
        .wp-admin-btn i { font-size: 12px; }
        
        /* Mobile Menu */
        .wp-mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 10px; }
        
        .container { max-width: 1200px; margin: auto; padding: 0 20px; }
        
        /* Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 140px; position: relative; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 50%, rgba(102,126,234,0.15), transparent 60%), radial-gradient(ellipse at 70% 30%, rgba(118,75,162,0.1), transparent 50%); }
        .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; position: relative; z-index: 1; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(102,126,234,0.15); color: #667eea; padding: 10px 20px; border-radius: 25px; font-size: 13px; font-weight: 600; margin-bottom: 24px; border: 1px solid rgba(102,126,234,0.3); }
        .hero-badge i { font-size: 14px; }
        .hero h1 { font-size: 52px; font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
        .hero h1 span { background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 17px; color: #888; margin-bottom: 32px; line-height: 1.8; }
        .btns { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-p { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; }
        .btn-p:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn-o { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-o:hover { border-color: #667eea; background: rgba(102,126,234,0.1); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 36px; }
        .stat { text-align: center; padding: 18px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); transition: 0.3s; }
        .stat:hover { border-color: rgba(102,126,234,0.3); transform: translateY(-2px); }
        .stat-icon { font-size: 20px; margin-bottom: 8px; color: #667eea; }
        .stat-n { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-l { font-size: 11px; color: #666; margin-top: 4px; }
        .visual { width: 100%; height: 400px; background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1)); border-radius: 20px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .visual::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, rgba(102,126,234,0.15), transparent); animation: rotate 20s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .visual-icon { font-size: 80px; z-index: 1; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(102,126,234,0.5)); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        
        /* Sections */
        .section { padding: 80px 0; }
        .section-t { text-align: center; margin-bottom: 50px; }
        .section-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(102,126,234,0.15); color: #667eea; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
        .section-badge i { font-size: 11px; }
        .section-t h2 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
        .section-t h2 span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-t p { color: #666; font-size: 15px; max-width: 550px; margin: auto; }
        
        /* Grids */
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        
        /* Cards */
        .card { background: #1a1a1a; padding: 24px; border-radius: 12px; border: 1px solid #2a2a2a; transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-3px); border-color: #667eea; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .card-icon { width: 44px; height: 44px; background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #667eea; }
        .card h3 { font-size: 15px; font-weight: 700; }
        .card p { font-size: 13px; color: #888; line-height: 1.6; }
        
        /* Paper Cards */
        .paper-card { background: #1a1a1a; padding: 24px; border-radius: 12px; border: 1px solid #2a2a2a; }
        .paper-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .cnt { background: linear-gradient(135deg, #667eea, #764ba2); padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .areas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .tag { background: rgba(102,126,234,0.12); color: #667eea; padding: 4px 8px; border-radius: 5px; font-size: 11px; display: flex; align-items: center; gap: 4px; transition: 0.3s; cursor: pointer; }
        .tag:hover { background: rgba(102,126,234,0.25); }
        .tag i { font-size: 10px; }
        
        /* Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab { background: #1a1a1a; color: #ccc; border: 1px solid #2a2a2a; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: #667eea; border-color: #667eea; color: #fff; }
        .tab:hover { background: rgba(102,126,234,0.2); }
        .tab i { font-size: 13px; }
        
        /* Commit Cards */
        .commit-card { background: #1a1a1a; padding: 28px; border-radius: 12px; border: 1px solid #2a2a2a; text-align: center; transition: 0.3s; }
        .commit-card:hover { transform: translateY(-3px); border-color: #667eea; }
        .commit-icon { width: 56px; height: 56px; background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 16px; color: #667eea; }
        .commit-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .commit-card p { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 12px; }
        .badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 5px 14px; border-radius: 15px; font-size: 11px; font-weight: 600; }
        .badge i { font-size: 10px; }
        
        /* API Cards */
        .api-card { background: #1a1a1a; padding: 14px; border-radius: 8px; border: 1px solid #2a2a2a; font-family: 'Courier New', monospace; transition: 0.3s; cursor: pointer; }
        .api-card:hover { transform: translateY(-2px); border-color: #4CAF50; }
        .api-card .method { color: #4CAF50; font-weight: bold; font-size: 11px; background: rgba(76,175,80,0.1); padding: 2px 6px; border-radius: 3px; }
        .api-card .endpoint { color: #667eea; font-size: 12px; margin-right: 8px; }
        .api-card .desc { color: #666; font-size: 11px; margin-top: 6px; }
        
        /* Contact */
        .contact-item { display: flex; align-items: center; gap: 14px; padding: 14px; background: #1a1a1a; border-radius: 10px; border: 1px solid #2a2a2a; transition: 0.3s; margin-bottom: 10px; }
        .contact-item:hover { border-color: #667eea; }
        .contact-icon { width: 44px; height: 44px; background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #667eea; }
        .contact-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .contact-item p { font-size: 12px; color: #888; }
        .socials { display: flex; gap: 8px; margin-top: 20px; }
        .social { width: 44px; height: 44px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; text-decoration: none; border: 1px solid #2a2a2a; color: #ccc; }
        .social:hover { background: #667eea; transform: translateY(-2px); color: #fff; }
        
        /* Chart */
        .chart-container { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; }
        
        /* Footer */
        .footer { background: #141414; padding: 50px 0 24px; border-top: 1px solid #2a2a2a; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .footer h4 { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .footer h4 i { color: #667eea; }
        .footer p { font-size: 12px; color: #666; line-height: 1.8; }
        .footer a { font-size: 12px; color: #666; text-decoration: none; display: flex; align-items: center; gap: 6px; line-height: 2; transition: 0.3s; }
        .footer a:hover { color: #667eea; }
        .footer a i { width: 14px; text-align: center; }
        .footer-bottom { text-align: center; padding-top: 20px; border-top: 1px solid #1e1e1e; }
        .footer-bottom p { font-size: 11px; color: #444; }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .footer-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .hero-grid, .grid-2 { grid-template-columns: 1fr; }
            .hero h1 { font-size: 32px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .wp-nav { display: none; }
            .wp-mobile-toggle { display: block; }
            .wp-top-bar { display: none; }
            .wp-admin-bar { display: none; }
            .grid-4, .grid-3 { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

// Papers Component
function Papers() {
    const [activeTab, setActiveTab] = useState('autism');
    const chartRef = useRef(null);
    
    useEffect(() => {
        if (chartRef.current) {
            const ctx = chartRef.current.getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: (activeTab === 'autism' ? AUTISM_AREAS : SCHIZO_AREAS).map(a=>a.name),
                    datasets: [{
                        data: Array(10).fill(10),
                        backgroundColor: ['#667eea','#764ba2','#f093fb','#4CAF50','#ff9800','#e91e63','#00bcd4','#ff5722','#9c27b0','#607d8b'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#888', font: { size: 10 } } } } }
            });
        }
    }, [activeTab]);
    
    return (
        <section className="section">
            <div className="container">
                <div className="section-t">
                    <div className="section-badge"><i className="fas fa-book"></i> مقالات</div>
                    <h2>300 مقاله <span>علمی</span></h2>
                    <p>مقالات علمی معتبر با DOI تأیید شده در 20 حوزه تخصصی</p>
                </div>
                <div className="tabs">
                    <button className={`tab ${activeTab==='autism'?'active':''}`} onClick={()=>setActiveTab('autism')}><i className="fas fa-puzzle-piece"></i> اوتیسم (100)</button>
                    <button className={`tab ${activeTab==='schizo'?'active':''}`} onClick={()=>setActiveTab('schizo')}><i className="fas fa-brain"></i> اسکیزوفرنی (100)</button>
                    <button className={`tab ${activeTab==='new'?'active':''}`} onClick={()=>setActiveTab('new')}><i className="fas fa-sparkles"></i> جدید (100)</button>
                </div>
                <div className="grid-2">
                    <div className="paper-card">
                        <h3><i className={`fas ${activeTab==='autism'?'fa-puzzle-piece':'fa-brain'}`} style={{color:'#667eea'}}></i> {activeTab==='autism'?'اوتیسم':activeTab==='schizo'?'اسکیزوفرنی':'مقالات جدید'} <span className="cnt">100</span></h3>
                        <p>مقالات علمی معتبر با DOI تأیید شده</p>
                        <div className="areas">
                            {(activeTab==='autism'?AUTISM_AREAS:SCHIZO_AREAS).map((a,i) => (
                                <span key={i} className="tag"><i className={`fas ${a.icon}`}></i> {a.name}</span>
                            ))}
                        </div>
                    </div>
                    <div className="chart-container">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            </div>
        </section>
    );
}
